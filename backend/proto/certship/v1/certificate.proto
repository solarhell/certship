syntax = "proto3";

package certship.v1;

option go_package = "github.com/solarhell/certship/pkg/api/certship/v1;certshipv1";

service CertificateService {
  rpc ListCertificates(ListCertificatesRequest) returns (ListCertificatesResponse);
}

message ListCertificatesRequest {
  uint64 limit = 1;
  optional string cursor = 2;
}

message CertificateItem {
  string id = 1;
  string domain = 2;
  string bucket = 3;
  string region = 4;
  string account_name = 5;
  string status = 6;
  string issued_at = 7;
  string expires_at = 8;
  string error_message = 9;
  string deploy_target = 10;
  string blocked_reason = 11;
}

message ListCertificatesResponse {
  repeated CertificateItem certificates = 1;
  optional string next_cursor = 2;
  bool has_more = 3;
  uint64 total_count = 4;
}
