syntax = "proto3";

package certship.v1;

option go_package = "github.com/solarhell/certship/pkg/api/certship/v1;certshipv1";

service AppSettingsService {
  rpc GetAppSettings(GetAppSettingsRequest) returns (GetAppSettingsResponse);
  rpc UpdateAppSettings(UpdateAppSettingsRequest) returns (UpdateAppSettingsResponse);
}

message GetAppSettingsRequest {}

message GetAppSettingsResponse {
  reserved 5, 6, 7, 8, 9;
  reserved "missing_grace", "archive_after", "archived_retention";

  string scan_interval = 3;
  int32 renew_before_days = 4;
  // 做 zone 探测与 DNS-01 校验的递归 DNS，逗号分隔的 host:port
  string dns_resolvers = 10;
}

message UpdateAppSettingsRequest {
  reserved 5, 6, 7, 8, 9;
  reserved "missing_grace", "archive_after", "archived_retention";

  string scan_interval = 3;
  int32 renew_before_days = 4;
  string dns_resolvers = 10;
}

message UpdateAppSettingsResponse {}
