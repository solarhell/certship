# pnpm 11 起，pnpm 的设置（catalog / overrides / peerDependencyRules）统一放在这里；
# package.json 里的 "pnpm" 字段已不再被读取，写在那里等于没写。
#
# vite-plus 用 @voidzero-dev/vite-plus-core 顶替 vite。
# 两者必须同步升级，否则 core 会去找版本对不上的原生二进制而启动失败，
# 所以版本锁在 catalog 这一处，package.json 只写 "catalog:"。
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0

overrides:
  # 依赖树里任何版本的 vite 都指向 catalog 里的同一份 core
  vite@*: "catalog:"

peerDependencyRules:
  # 插件声明的 peer 是 vite 的版本，而 core 使用独立版本号，无法直接匹配。
  # 这是 vite-plus 的设计而非依赖冲突。
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
